blueprint:
  name: Défis Hilo – Automatisation simplifiée (Ari Version)
  description: Gestion des défis Hilo avec filtrage AM/PM et remise à la normale en fin de défi
  domain: automation

  input:
    default_challenge_entity:
      name: Entité du défi Hilo
      selector:
        entity:
          domain: sensor

    challenge_thermostats:
      name: Thermostats à gérer
      default: []
      selector:
        target:
          entity:
            domain: climate

    water_heater_switch:
      name: Interrupteur Chauffe-eau
      default: []
      selector:
        target:
          entity:
            domain: switch

    other_devices_switch:
      name: Autres appareils à couper (facultatif)
      default: []
      selector:
        target:
          entity:
            domain: switch

    # Températures
    normal_temp:
      name: Température normale
      default: 19
      selector:
        number:
          step: 0.5
          min: 10
          max: 30
          unit_of_measurement: °C

    appreciation_temp:
      name: Température pendant appréciation
      default: 21
      selector:
        number:
          step: 0.5
          min: 10
          max: 30
          unit_of_measurement: °C

    challenge_temp:
      name: Température pendant réduction
      default: 17
      selector:
        number:
          step: 0.5
          min: 10
          max: 30
          unit_of_measurement: °C

    pre_heat_temp:
      name: Température pré-chauffage
      default: 21
      selector:
        number:
          step: 0.5
          min: 10
          max: 30
          unit_of_measurement: °C

    # Flags
    do_pre_heat:
      name: Activer Pré-chauffage
      default: true
      selector:
        boolean: {}

    bool_shut_thermostat:
      name: Fermer thermostats pendant réduction (au lieu de température)
      default: false
      selector:
        boolean: {}

    challenge_am:
      name: Le défi est AM
      default: true
      selector:
        boolean: {}

    challenge_pm:
      name: Le défi est PM
      default: true
      selector:
        boolean: {}

trigger:
  - platform: state
    entity_id: !input default_challenge_entity

variables:
  # Entité & état du défi
  challenge_entity: !input default_challenge_entity
  challenge_state: "{{ states(challenge_entity) | lower }}"

  # Sélection utilisateur
  challenge_am: !input challenge_am
  challenge_pm: !input challenge_pm
  do_pre_heat: !input do_pre_heat
  shut_thermostat: !input bool_shut_thermostat

  # Heure courante (locale HA)
  hour: "{{ now().hour }}"

  # Fenêtres AM/PM selon l'état courant
  # AM: pré-chauffage 04–06, réduction 06–10, appréciation 01–03
  is_am_window: >
    {% if challenge_state == 'pre_heat' %}
      {{ (hour >= 4) and (hour < 6) }}
    {% elif challenge_state == 'reduction' %}
      {{ (hour >= 6) and (hour < 10) }}
    {% elif challenge_state == 'appreciation' %}
      {{ (hour >= 1) and (hour < 3) }}
    {% else %}
      false
    {% endif %}

  # PM: pré-chauffage 14–16, réduction 16–20, appréciation 12–14
  is_pm_window: >
    {% if challenge_state == 'pre_heat' %}
      {{ (hour >= 14) and (hour < 16) }}
    {% elif challenge_state == 'reduction' %}
      {{ (hour >= 16) and (hour < 20) }}
    {% elif challenge_state == 'appreciation' %}
      {{ (hour >= 12) and (hour < 14) }}
    {% else %}
      false
    {% endif %}

  # Autorisation en fonction du choix AM/PM et de la fenêtre active
  window_ok: >
    {{ (challenge_am and is_am_window) or (challenge_pm and is_pm_window) }}

  # Cibles des interrupteurs (peuvent être vides)
  water_heater_target: !input water_heater_switch
  other_devices_target: !input other_devices_switch

# Pas de condition globale : on gère le filtrage par état ci-dessous
action:
  - choose:
      # ---------- Pré-chauffage ----------
      - conditions: >
          {{ challenge_state == 'pre_heat' and do_pre_heat and window_ok }}
        sequence:
          - service: climate.set_temperature
            target: !input challenge_thermostats
            data:
              temperature: !input pre_heat_temp

      # ---------- Réduction ----------
      - conditions: >
          {{ challenge_state == 'reduction' and window_ok }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ shut_thermostat }}"
            then:
              - service: climate.turn_off
                target: !input challenge_thermostats
            else:
              - service: climate.set_temperature
                target: !input challenge_thermostats
                data:
                  temperature: !input challenge_temp

          # Couper le chauffe-eau si une cible est fournie
          - if:
              - condition: template
                value_template: "{{ water_heater_target | default({}) | length > 0 }}"
            then:
              - service: switch.turn_off
                target: !input water_heater_switch

          # Couper les autres appareils si une cible est fournie
          - if:
              - condition: template
                value_template: "{{ other_devices_target | default({}) | length > 0 }}"
            then:
              - service: switch.turn_off
                target: !input other_devices_switch

      # ---------- Appréciation ----------
      - conditions: >
          {{ challenge_state == 'appreciation' and window_ok }}
        sequence:
          - service: climate.set_temperature
            target: !input challenge_thermostats
            data:
              temperature: !input appreciation_temp

      # ---------- Fin du défi : remise à la normale ----------
      - conditions: >
          {{ challenge_state not in ['pre_heat', 'reduction', 'appreciation'] }}
        sequence:
          - service: climate.turn_on
            target: !input challenge_thermostats
          - service: climate.set_temperature
            target: !input challenge_thermostats
            data:
              temperature: !input normal_temp

          # Rallumer le chauffe-eau si une cible est fournie
          - if:
              - condition: template
                value_template: "{{ water_heater_target | default({}) | length > 0 }}"
            then:
              - service: switch.turn_on
                target: !input water_heater_switch

          # Rallumer les autres appareils si une cible est fournie
          - if:
              - condition: template
                value_template: "{{ other_devices_target | default({}) | length > 0 }}"
            then:
              - service: switch.turn_on
